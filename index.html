<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Cabinet Psychiatrique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-inter min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-purple-900">

  <div class="w-full max-w-md mx-4">
    <div class="bg-white rounded-3xl shadow-2xl p-8">
      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto bg-gradient-to-br from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center shadow-lg shadow-purple-500/25 mb-4">
          <i class="fas fa-brain text-white text-2xl"></i>
        </div>
        <h1 class="text-2xl font-bold text-gray-800">Cabinet Psychiatrique</h1>
        <p class="text-sm text-gray-500 mt-2">Connectez-vous à votre espace</p>
      </div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <input type="email" id="email" required class="form-input" placeholder="docteur@exemple.dz">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Mot de passe</label>
          <input type="password" id="password" required class="form-input" placeholder="••••••••">
        </div>
        <p id="error" class="text-red-500 text-sm hidden"></p>
        <button type="submit" class="btn-primary w-full justify-center">
          <i class="fas fa-sign-in-alt mr-2"></i> Se connecter
        </button>
      </form>
    </div>
  </div>

  <script type="module">

    import { auth } from './assets/js/firebase-config.js';
    import { signInWithEmailAndPassword, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    onAuthStateChanged(auth, u => { if (u) location.href = 'dashboard.html'; });

    document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const errEl = document.getElementById('error');
    errEl.classList.add('hidden');
    try {
        await signInWithEmailAndPassword(
        auth,
        document.getElementById('email').value.trim(),
        document.getElementById('password').value
        );
        location.href = 'dashboard.html';
    } catch (err) {
        console.error(err);
        errEl.textContent = 'Identifiants invalides. Vérifiez votre email et mot de passe.';
        errEl.classList.remove('hidden');
    }
    });
  </script>
</body>
</html>
