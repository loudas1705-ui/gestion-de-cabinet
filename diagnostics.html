<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagnostics — Cabinet Psychiatrique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-inter bg-gradient-to-br from-slate-50 via-white to-purple-50/30">
  <div id="layout"></div>
  <main class="ml-72 min-h-screen">
    <div id="topbar"></div>
    <div class="p-8">

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8" id="statsGrid"></div>

      <div class="mb-6 bg-white rounded-2xl shadow-sm border border-gray-100 p-4">
        <div class="flex items-center gap-3">
          <div class="relative flex-1">
            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Rechercher un patient ou un diagnostic..."
                   class="form-input pl-11 w-full">
          </div>
          <button id="searchBtn" class="btn-primary"><i class="fas fa-search mr-1"></i> Rechercher</button>
          <button id="clearBtn" class="btn-secondary" style="display:none;"><i class="fas fa-times mr-1"></i> Effacer</button>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 bg-gradient-to-r from-purple-50 to-pink-50 border-b border-gray-100">
          <h3 class="font-bold text-gray-800 flex items-center">
            <i class="fas fa-stethoscope mr-2 text-purple-600"></i> Diagnostics des patients
            <span id="resultCount" class="ml-3 text-sm font-normal text-gray-500"></span>
          </h3>
        </div>
        <div id="diagnosticsList" class="divide-y divide-gray-100">
          <div class="p-12 text-center text-gray-400"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderLayout } from './assets/js/layout.js';
    import { listPatients } from './assets/js/db.js';
    import { escapeHtml, fullName, calcAge } from './assets/js/helpers.js';

    let allPatients = [];
    let filtered = [];
    let search = '';

    (async () => {
      await requireAuth();
      renderLayout('diagnostics.html');
      await load();
    })();

    async function load() {
      allPatients = await listPatients();
      filter();
      renderStats();
    }

    function filter() {
      const s = search.trim().toLowerCase();
      filtered = allPatients.filter(p => {
        if (!p.diagnosis || !String(p.diagnosis).trim()) return false;
        if (!s) return true;
        const hay = `${p.first_name || ''} ${p.last_name || ''} ${p.diagnosis || ''}`.toLowerCase();
        return hay.includes(s);
      });
      renderList();
    }

    function renderStats() {
      const withDiag = allPatients.filter(p => p.diagnosis && String(p.diagnosis).trim()).length;
      const total = allPatients.length;
      document.getElementById('statsGrid').innerHTML = `
        ${card('Patients avec diagnostic', withDiag, 'stethoscope', 'purple')}
        ${card('Total patients', total, 'users', 'blue')}
        ${card('Sans diagnostic', total - withDiag, 'question', 'amber')}
      `;
    }

    function card(label, value, icon, color) {
      return `
        <div class="stat-card">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500 text-sm font-medium">${escapeHtml(label)}</p>
              <p class="text-3xl font-bold text-gray-800 mt-1">${escapeHtml(value)}</p>
            </div>
            <div class="w-12 h-12 bg-gradient-to-br from-${color}-500 to-${color}-600 rounded-xl flex items-center justify-center shadow-lg">
              <i class="fas fa-${icon} text-white text-xl"></i>
            </div>
          </div>
        </div>`;
    }

    function renderList() {
      const box = document.getElementById('diagnosticsList');
      const countEl = document.getElementById('resultCount');
      countEl.textContent = search ? `(${filtered.length} résultat${filtered.length > 1 ? 's' : ''} pour "${search}")` : '';

      if (!filtered.length) {
        box.innerHTML = `<div class="p-12 text-center text-gray-400">
          <i class="fas fa-stethoscope text-4xl mb-3 block"></i>
          ${search ? '<p>Aucun patient ne correspond à votre recherche.</p>'
                   : '<p>Aucun diagnostic enregistré.</p><p class="text-sm mt-2">Ajoutez un diagnostic depuis la page <a href="patients.html" class="text-purple-600 hover:underline">Patients</a>.</p>'}
        </div>`;
        return;
      }

      box.innerHTML = filtered.map(p => {
        const age = calcAge(p.date_of_birth);
        const genderText = p.gender === 'M' ? 'M' : p.gender === 'F' ? 'F' : '';
        return `
          <div class="p-5 hover:bg-purple-50/30 transition-colors">
            <div class="flex items-start gap-4">
              <div class="w-12 h-12 bg-gradient-to-br from-purple-500 to-pink-500 rounded-full flex items-center justify-center shadow-md flex-shrink-0">
                <i class="fas fa-user text-white"></i>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between gap-3 flex-wrap">
                  <div>
                    <h4 class="font-bold text-gray-800 text-lg">${escapeHtml(fullName(p))}</h4>
                    <p class="text-xs text-gray-500 mt-0.5">
                      ${age !== '' ? `<i class="fas fa-birthday-cake mr-1"></i>${age} ans` : ''}
                      ${genderText ? `&nbsp;•&nbsp; <i class="fas fa-venus-mars mr-1"></i>${genderText}` : ''}
                      ${p.phone ? `&nbsp;•&nbsp; <i class="fas fa-phone-alt mr-1"></i>${escapeHtml(p.phone)}` : ''}
                    </p>
                  </div>
                  <div class="flex items-center gap-2">
                    <a href="patients.html" class="text-blue-600 hover:text-blue-800 p-2 rounded-lg hover:bg-blue-50" title="Modifier"><i class="fas fa-edit"></i></a>
                    <a href="appointments.html?patient_id=${p.id}" class="text-purple-600 hover:text-purple-800 p-2 rounded-lg hover:bg-purple-50" title="Rendez-vous"><i class="fas fa-calendar-alt"></i></a>
                    <a href="prescriptions.html?patient_id=${p.id}" class="text-green-600 hover:text-green-800 p-2 rounded-lg hover:bg-green-50" title="Prescriptions"><i class="fas fa-prescription-bottle"></i></a>
                  </div>
                </div>
                <div class="mt-3 bg-purple-50 border-l-4 border-purple-500 rounded-r-lg p-3">
                  <p class="text-xs font-semibold text-purple-700 uppercase tracking-wide mb-1">
                    <i class="fas fa-notes-medical mr-1"></i> Diagnostic
                  </p>
                  <p class="text-sm text-gray-700 whitespace-pre-line">${escapeHtml(p.diagnosis)}</p>
                </div>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    const input = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    document.getElementById('searchBtn').addEventListener('click', () => {
      search = input.value.trim();
      clearBtn.style.display = search ? 'inline-flex' : 'none';
      filter();
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        document.getElementById('searchBtn').click();
      }
    });
    clearBtn.addEventListener('click', () => {
      input.value = '';
      search = '';
      clearBtn.style.display = 'none';
      filter();
    });
  </script>
</body>
</html>
