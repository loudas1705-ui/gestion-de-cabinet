<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rendez-vous — Cabinet Psychiatrique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-inter bg-gradient-to-br from-slate-50 via-white to-purple-50/30">
  <div id="layout"></div>
  <main class="ml-72 min-h-screen">
    <div id="topbar"></div>
    <div class="p-8">

      <div id="messages"></div>

      <div class="mb-6">
        <button onclick="openAppointmentModal()" class="btn-primary">
          <i class="fas fa-plus-circle"></i> Nouveau rendez-vous
        </button>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 bg-gradient-to-r from-blue-50 to-indigo-50 border-b border-gray-100">
          <h3 class="font-bold text-gray-800 flex items-center">
            <i class="fas fa-calendar-alt mr-2 text-blue-600"></i> Liste des rendez-vous
          </h3>
        </div>
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Patient</th><th>Date & heure</th><th>Durée</th><th>Statut</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="appointmentsTableBody">
              <tr><td colspan="5" class="text-center py-6 text-gray-400">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="appointmentModal" class="modal-overlay" style="display: none;">
    <div class="modal-container">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center">
        <h3 class="text-xl font-bold text-gray-800" id="modalTitleAppointment">Nouveau rendez-vous</h3>
        <button onclick="closeAppointmentModal()" class="text-gray-400 hover:text-gray-600">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <form class="p-6 space-y-5" id="appointmentForm">
        <input type="hidden" id="appointmentId" value="">

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Patient *</label>
          <select id="patientSelect" required class="form-select">
            <option value="">Sélectionner un patient</option>
          </select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Date *</label>
            <input type="date" id="appointmentDate" required class="form-input">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-2">Heure *</label>
            <input type="time" id="appointmentTime" required class="form-input">
            <p id="timeError" class="text-red-500 text-xs mt-1 hidden"></p>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Durée (minutes)</label>
          <select id="durationMinutes" class="form-select">
            <option value="30">30 minutes</option>
            <option value="45">45 minutes</option>
            <option value="60" selected>60 minutes</option>
            <option value="90">90 minutes</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">Notes</label>
          <textarea id="appointmentNotes" rows="3" class="form-textarea" placeholder="Motif de consultation, observations..."></textarea>
        </div>

        <div id="statusField" style="display: none;">
          <label class="block text-sm font-medium text-gray-700 mb-2">Statut</label>
          <select id="appointmentStatus" class="form-select">
            <option value="scheduled">Programmé</option>
            <option value="completed">Terminé</option>
            <option value="cancelled">Annulé</option>
            <option value="no_show">Non présent</option>
          </select>
        </div>

        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" onclick="closeAppointmentModal()" class="btn-secondary">Annuler</button>
          <button type="submit" class="btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderLayout } from './assets/js/layout.js';
    import {
      listAppointments, addAppointment, updateAppointment,
      deleteAppointment, listPatients
    } from './assets/js/db.js';
    import {
      escapeHtml, fullName, showMessage, formatDateInput, formatTimeInput, formatDateFR
    } from './assets/js/helpers.js';

    let appointmentsCache = [];
    let patientsCache = [];
    let editingId = null;

    (async () => {
      await requireAuth();
      renderLayout('appointments.html');
      await Promise.all([loadPatients(), loadAppointments()]);
    })();

    async function loadPatients() {
      patientsCache = await listPatients();
      const sel = document.getElementById('patientSelect');
      sel.innerHTML = '<option value="">Sélectionner un patient</option>' +
        patientsCache.map(p => `<option value="${p.id}">${escapeHtml(fullName(p))}</option>`).join('');
      const params = new URLSearchParams(location.search);
      const pid = params.get('patient_id');
      if (pid) sel.value = pid;
    }

    async function loadAppointments() {
      const params = new URLSearchParams(location.search);
      const filterPatient = params.get('patient_id');
      appointmentsCache = await listAppointments(filterPatient || null);
      renderTable();
    }

    function patientLabel(id) {
      const p = patientsCache.find(x => x.id === id);
      return p ? fullName(p) : '—';
    }

    function renderTable() {
      const tbody = document.getElementById('appointmentsTableBody');
      if (!appointmentsCache.length) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-gray-400">
          <i class="fas fa-calendar-week text-4xl mb-3 block"></i>Aucun rendez-vous programmé</td></tr>`;
        return;
      }
      const now = new Date();
      const statusText = { scheduled: 'Programmé', completed: 'Terminé', cancelled: 'Annulé', no_show: 'Non présent' };
      const statusCls = { scheduled: 'badge-scheduled', completed: 'badge-completed', cancelled: 'badge-cancelled', no_show: 'badge-no_show' };

      tbody.innerHTML = appointmentsCache.map(a => {
        const d = a.appointment_date?.toDate ? a.appointment_date.toDate() : new Date(a.appointment_date);
        const isPast = d < now;
        const isScheduled = a.status === 'scheduled';
        const rowCls = isPast && isScheduled ? 'bg-yellow-50/30' : '';

        return `
          <tr class="${rowCls}">
            <td class="font-medium text-gray-800">${escapeHtml(patientLabel(a.patient_id))}</td>
            <td>${formatDateFR(a.appointment_date)}
              <div class="text-xs text-gray-400">${d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })}</div>
            </td>
            <td>${a.duration_minutes || 60} min</td>
            <td>
              <span class="px-3 py-1 rounded-full text-xs font-medium ${statusCls[a.status] || 'badge-scheduled'}">
                ${statusText[a.status] || a.status}
              </span>
              ${isPast && isScheduled ? '<div class="text-xs text-red-500 mt-1">⚠️ Dépassé</div>' : ''}
            </td>
            <td>
              <div class="flex space-x-2">
                <button onclick="editAppointment('${a.id}')" class="text-blue-600 hover:text-blue-800 p-2 rounded-lg hover:bg-blue-50" title="Modifier">
                  <i class="fas fa-edit"></i>
                </button>
                ${isScheduled ? `
                  <button onclick="setStatus('${a.id}','completed')" class="text-green-600 hover:text-green-800 p-2 rounded-lg hover:bg-green-50" title="Terminer">
                    <i class="fas fa-check-circle"></i>
                  </button>
                  <button onclick="setStatus('${a.id}','cancelled')" class="text-orange-600 hover:text-orange-800 p-2 rounded-lg hover:bg-orange-50" title="Annuler">
                    <i class="fas fa-times-circle"></i>
                  </button>` : ''}
                <button onclick="removeAppointment('${a.id}')" class="text-red-600 hover:text-red-800 p-2 rounded-lg hover:bg-red-50" title="Supprimer">
                  <i class="fas fa-trash-alt"></i>
                </button>
                <a href="prescriptions.html?patient_id=${a.patient_id}" class="text-purple-600 hover:text-purple-800 p-2 rounded-lg hover:bg-purple-50" title="Prescrire">
                  <i class="fas fa-prescription-bottle"></i>
                </a>
              </div>
            </td>
          </tr>`;
      }).join('');
    }

    window.openAppointmentModal = function (appt = null) {
      const modal = document.getElementById('appointmentModal');
      editingId = null;

      const dateInput = document.getElementById('appointmentDate');
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const d = String(today.getDate()).padStart(2, '0');
      dateInput.min = `${y}-${m}-${d}`;

      if (appt) {
        editingId = appt.id;
        document.getElementById('modalTitleAppointment').textContent = 'Modifier le rendez-vous';
        document.getElementById('appointmentId').value = appt.id;
        document.getElementById('patientSelect').value = appt.patient_id;
        document.getElementById('appointmentDate').value = formatDateInput(appt.appointment_date);
        document.getElementById('appointmentTime').value = formatTimeInput(appt.appointment_date);
        document.getElementById('appointmentNotes').value = appt.notes || '';
        document.getElementById('durationMinutes').value = appt.duration_minutes || 60;
        document.getElementById('appointmentStatus').value = appt.status || 'scheduled';
        document.getElementById('statusField').style.display = 'block';
      } else {
        document.getElementById('modalTitleAppointment').textContent = 'Nouveau rendez-vous';
        document.getElementById('appointmentId').value = '';
        document.getElementById('patientSelect').value = '';
        document.getElementById('appointmentDate').value = '';
        document.getElementById('appointmentTime').value = '';
        document.getElementById('appointmentNotes').value = '';
        document.getElementById('durationMinutes').value = '60';
        document.getElementById('statusField').style.display = 'none';
      }
      modal.style.display = 'flex';
    };

    window.closeAppointmentModal = function () {
      document.getElementById('appointmentModal').style.display = 'none';
      document.getElementById('timeError').classList.add('hidden');
    };

    window.editAppointment = function (id) {
      const a = appointmentsCache.find(x => x.id === id);
      if (a) openAppointmentModal(a);
    };

    window.setStatus = async function (id, status) {
      await updateAppointment(id, { status });
      showMessage('messages', status === 'completed' ? 'Consultation terminée' : 'Rendez-vous annulé', 'success');
      loadAppointments();
    };

    window.removeAppointment = async function (id) {
      if (!confirm('Supprimer ce rendez-vous ?')) return;
      await deleteAppointment(id);
      showMessage('messages', 'Rendez-vous supprimé avec succès', 'success');
      loadAppointments();
    };

    function validateDateTime() {
      const dateVal = document.getElementById('appointmentDate').value;
      const timeVal = document.getElementById('appointmentTime').value;
      const timeError = document.getElementById('timeError');
      if (!dateVal || !timeVal) return true;
      timeError.classList.add('hidden');
      const selected = new Date(`${dateVal}T${timeVal}`);
      const now = new Date();
      if (selected < now) {
        timeError.textContent = "⚠️ Impossible de programmer un rendez-vous dans le passé.";
        timeError.classList.remove('hidden');
        return false;
      }
      return true;
    }

    document.getElementById('appointmentDate').addEventListener('change', validateDateTime);
    document.getElementById('appointmentTime').addEventListener('change', validateDateTime);

    document.getElementById('appointmentForm').addEventListener('submit', async e => {
      e.preventDefault();
      if (!validateDateTime()) return;

      const dateVal = document.getElementById('appointmentDate').value;
      const timeVal = document.getElementById('appointmentTime').value;
      const dt = new Date(`${dateVal}T${timeVal}`);

      const data = {
        patient_id: document.getElementById('patientSelect').value,
        appointment_date: dt,
        duration_minutes: parseInt(document.getElementById('durationMinutes').value, 10),
        notes: document.getElementById('appointmentNotes').value.trim() || null
      };

      try {
        if (editingId) {
          data.status = document.getElementById('appointmentStatus').value || 'scheduled';
          await updateAppointment(editingId, data);
          showMessage('messages', 'Rendez-vous mis à jour avec succès', 'success');
        } else {
          data.status = 'scheduled';
          await addAppointment(data);
          showMessage('messages', 'Rendez-vous créé avec succès', 'success');
        }
        closeAppointmentModal();
        loadAppointments();
      } catch (err) {
        console.error(err);
        showMessage('messages', 'Erreur : ' + err.message, 'error');
      }
    });
  </script>
</body>
</html>
