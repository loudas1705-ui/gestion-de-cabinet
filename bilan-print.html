<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilan biologique</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { min-height:100%; }
    body { font-family:'Georgia','Times New Roman',serif; background:#eeeeee; display:flex; justify-content:center; align-items:flex-start; padding:20px; }
    .prescription { width:148mm; min-height:210mm; height:auto; background:#fdfcfa; padding:12mm 12mm 10mm; position:relative; box-shadow:0 10px 25px rgba(0,0,0,.15); border-radius:4px; display:flex; flex-direction:column; }
    .header { flex-shrink:0; margin-bottom:8px; }
    .header-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .header-left { text-align:left; line-height:1.3; }
    .header-right { text-align:right; font-size:11px; color:#2c3e50; font-style:italic; padding-top:5px; white-space:nowrap; }
    .doctor-name { font-size:15px; font-weight:700; color:#2c3e50; letter-spacing:.5px; }
    .doctor-title { font-size:11px; color:#2c3e50; margin-top:1px; font-style:italic; letter-spacing:1px; }
    .doctor-info-line { font-size:9px; color:#2c3e50; margin-top:1px; }
    .header-separator { border-bottom:1.5px solid #2c3e50; margin-top:8px; }
    .document-title { text-align:center; margin:15px 0 20px; flex-shrink:0; }
    .document-title span { font-size:18px; font-weight:700; color:#2c3e50; letter-spacing:3px; text-transform:uppercase; font-style:italic; border-bottom:1.5px solid #2c3e50; padding-bottom:4px; display:inline-block; }
    .patient-section { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-shrink:0; }
    .patient-info { font-size:14px; color:#2c3e50; font-style:italic; padding:0 5px; margin-bottom:10px; flex:1; }
    .patient-info p { margin-bottom:4px; }
    .fill-line { display:inline-block; min-width:180px; padding:0 5px; font-style:normal; font-weight:600; }
    .fill-line.short { min-width:80px; }
    .bilan-number { font-size:12px; font-weight:700; color:#2c3e50; font-style:italic; letter-spacing:1px; padding:5px 8px 0 0; white-space:nowrap; }
    .tests-heading { font-size:13px; font-weight:700; color:#2c3e50; padding:4px 5px 6px; border-bottom:1.5px solid #2c3e50; text-transform:uppercase; letter-spacing:.5px; font-style:italic; margin-bottom:7px; }
    .tests-list { list-style:none; columns:2; column-gap:18px; margin:0 5px 8px; }
    .tests-list li { break-inside:avoid; position:relative; padding:3px 3px 3px 15px; font-size:11.5px; line-height:1.3; color:#2c3e50; border-bottom:1px dotted #cbd5e1; }
    .tests-list li::before {
        content: '';
        position: absolute;
        left: 0;
        top: 5px;
        width: 11px;
        height: 11px;
        border: 1.3px solid #2c3e50;
        border-radius: 1px;
        }

        .tests-list li::after {
        content: '✓';
        position: absolute;
        left: 1px;
        top: -1px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        font-weight: bold;
        color: #2c3e50;
        }
    .spacer { flex-grow:1; min-height:22mm; }
    .footer-section { flex-shrink:0; padding-top:8px; border-top:1.5px solid #2c3e50; margin-top:8px; }
    .footer-text { text-align:center; font-size:9px; color:#2c3e50; margin-top:6px; font-style:italic; font-weight:600; }
    .print-btn,.back-btn { position:fixed; right:20px; color:white; border:none; padding:12px 24px; border-radius:40px; font-size:14px; font-weight:600; cursor:pointer; transition:all .3s ease; z-index:1000; font-family:'Segoe UI',Arial,sans-serif; }
    .print-btn { bottom:20px; background:#2c3e50; box-shadow:0 4px 15px rgba(44,62,80,.4); }
    .print-btn:hover { background:#1a252f; transform:translateY(-2px); }
    .back-btn { bottom:80px; background:#6c757d; box-shadow:0 4px 15px rgba(108,117,125,.4); }
    .back-btn:hover { background:#5a6268; transform:translateY(-2px); }
    .test-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 5px 2px;
  font-size: 14px;
  color: #2c3e50;
}

.test-check {
  width: 15px;
  height: 15px;
  border: 1.5px solid #2c3e50;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  font-size: 12px;
  font-weight: bold;
  flex-shrink: 0;
}
    @page { size:A5 portrait; margin:0; }
    @media print {
      html,body { width:148mm !important; min-height:210mm !important; margin:0 !important; padding:0 !important; background:white !important; display:block !important; }
      .print-btn,.back-btn { display:none !important; }
      .prescription { width:148mm !important; min-height:210mm !important; height:auto !important; margin:0 !important; padding:12mm 12mm 10mm !important; box-shadow:none !important; border-radius:0 !important; background:white !important; }
      .spacer { min-height:15mm; }
      * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    }
  </style>
</head>
<body>
  <button class="print-btn" onclick="window.print()">🖨 Imprimer le bilan</button>
  <button class="back-btn" onclick="window.location.href='bilans.html'">← Retour</button>
  <div class="prescription" id="content"><p style="color:#999;text-align:center;">Chargement…</p></div>

  <script type="module">
    import { doctor } from './assets/js/doctor.js';
    import { getBilan, getPatient } from './assets/js/db.js';
    import { escapeHtml, calcAge, formatDateFR } from './assets/js/helpers.js';

    const id = new URLSearchParams(location.search).get('id');
    const content = document.getElementById('content');
    if (!id) { content.textContent = 'ID invalide'; throw new Error('Bilan ID missing'); }

    async function load() {
      try {
        const bilan = await getBilan(id);
        if (!bilan) { content.textContent = 'Bilan non trouvé'; return; }
        const patient = await getPatient(bilan.patient_id);
        if (!patient) { content.textContent = 'Patient non trouvé'; return; }

        const age = calcAge(patient.date_of_birth);
        const patientFullName = `${patient.last_name || ''} ${patient.first_name || ''}`.trim();
        const tests = Array.isArray(bilan.tests) ? bilan.tests : [];
        const number = bilan.number_label || (bilan.number ? `N° ${String(bilan.number).padStart(3, '0')}` : '');
        const testItems = tests.map(test => `<li>${escapeHtml(test)}</li>`).join('');
        const testRows = tests.map(test => `
        <div class="test-row">
            <span class="test-check">&#10003;</span>
            <span>${escapeHtml(test)}</span>
        </div>
        `).join('');

        content.innerHTML = `
          <div class="header">
            <div class="header-top">
              <div class="header-left">
                <div class="doctor-name">${escapeHtml(doctor.name)}</div>
                <div class="doctor-title">${escapeHtml(doctor.title)}</div>
                <div class="doctor-info-line">${escapeHtml(doctor.address)}</div>
                <div class="doctor-info-line">Tél : ${escapeHtml(doctor.phone)}</div>
                <div class="doctor-info-line">Fix : ${escapeHtml(doctor.fix)}</div>
                <div class="doctor-info-line">${escapeHtml(doctor.registry)}</div>
              </div>
              <div class="header-right">Annaba le : ${escapeHtml(formatDateFR(bilan.bilan_date))}</div>
            </div>
            <div class="header-separator"></div>
          </div>

          <div class="patient-section">
            <div class="patient-info">
              <p>Nom et Prénom : <span class="fill-line">${escapeHtml(patientFullName)}</span></p>
              <p>Âge : <span class="fill-line short">${age === null || age === undefined ? '' : escapeHtml(age)}${age === null || age === undefined ? '' : ' ans'}</span></p>
            </div>
            ${number ? `<div class="bilan-number">${escapeHtml(number)}</div>` : ''}
          </div>

          <div class="document-title"><span>Bilan</span></div>
          ${tests.length ? `<ul class="tests-list">${testItems}</ul>` : '<p style="font-size:11px;color:#999;text-align:center;">Aucune analyse indiquée</p>'}
          <div class="spacer"></div>
          <div class="footer-section"></div>
        `;
      } catch (error) {
        console.error(error);
        content.textContent = 'Erreur lors du chargement du bilan : ' + error.message;
      }
    }
    load();
  </script>
</body>
</html>
