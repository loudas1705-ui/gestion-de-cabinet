<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patients — Cabinet Psychiatrique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-inter bg-gradient-to-br from-slate-50 via-white to-purple-50/30">
  <div id="layout"></div>
  <main class="ml-72 min-h-screen">
    <div id="topbar"></div>
    <div class="p-8">

      <div id="messages"></div>

      <div class="mb-6">
        <button onclick="openPatientModal()" class="btn-primary">
          <i class="fas fa-plus-circle"></i> Nouveau patient
        </button>
      </div>

      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="px-6 py-4 bg-gradient-to-r from-purple-50 to-pink-50 border-b border-gray-100">
          <h3 class="font-bold text-gray-800 flex items-center">
            <i class="fas fa-list mr-2 text-purple-600"></i> Liste des patients
          </h3>
        </div>
        <div class="overflow-x-auto">
          <table class="data-table">
            <thead>
              <tr>
                <th>Nom complet</th><th>Naissance</th><th>Âge</th>
                <th>Sexe</th><th>Diagnostic</th><th>Contact</th><th>Actions</th>
              </tr>
            </thead>
            <tbody id="patientsTableBody">
              <tr><td colspan="7" class="text-center py-6 text-gray-400">Chargement…</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <div id="patientModal" class="modal-overlay" style="display:none;">
    <div class="modal-container">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center">
        <h3 class="text-xl font-bold text-gray-800" id="modalTitle">Nouveau patient</h3>
        <button onclick="closePatientModal()" class="text-gray-400 hover:text-gray-600">
          <i class="fas fa-times text-xl"></i>
        </button>
      </div>
      <form id="patientForm" class="p-6 space-y-5">
        <input type="hidden" id="patientId">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div><label class="block text-sm font-medium text-gray-700 mb-2">Prénom *</label>
            <input type="text" id="firstName" required class="form-input"></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-2">Nom *</label>
            <input type="text" id="lastName" required class="form-input"></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div><label class="block text-sm font-medium text-gray-700 mb-2">Date de naissance *</label>
            <input type="date" id="dob" required class="form-input"></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-2">Sexe</label>
            <select id="gender" class="form-select">
              <option value="">Non précisé</option>
              <option value="M">Masculin</option>
              <option value="F">Féminin</option>
            </select></div>
        </div>
        <div><label class="block text-sm font-medium text-gray-700 mb-2">Téléphone *</label>
          <input type="tel" id="phone" required class="form-input"></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-2">Adresse</label>
          <textarea id="address" rows="2" class="form-textarea"></textarea></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
          <div><label class="block text-sm font-medium text-gray-700 mb-2">Contact urgence (nom)</label>
            <input type="text" id="emergencyName" class="form-input"></div>
          <div><label class="block text-sm font-medium text-gray-700 mb-2">Contact urgence (tél.)</label>
            <input type="tel" id="emergencyPhone" class="form-input"></div>
        </div>
        <div><label class="block text-sm font-medium text-gray-700 mb-2">
          <i class="fas fa-stethoscope text-purple-600 mr-2"></i>Diagnostic</label>
          <textarea id="diagnosis" rows="3" class="form-textarea"></textarea></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-2">Antécédents médicaux</label>
          <textarea id="medicalHistory" rows="2" class="form-textarea"></textarea></div>
        <div><label class="block text-sm font-medium text-gray-700 mb-2">Antécédents psychiatriques</label>
          <textarea id="psychiatricHistory" rows="2" class="form-textarea"></textarea></div>
        <div class="flex justify-end space-x-3 pt-4">
          <button type="button" onclick="closePatientModal()" class="btn-secondary">Annuler</button>
          <button type="submit" class="btn-primary">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './assets/js/auth.js';
    import { renderLayout } from './assets/js/layout.js';
    import { listPatients, addPatient, updatePatient, deletePatient } from './assets/js/db.js';
    import { escapeHtml, fullName, calcAge, formatDateFR, showMessage } from './assets/js/helpers.js';

    let patientsCache = [];

    (async () => {
      await requireAuth();
      renderLayout('patients.html');
      await loadPatients();
    })();

    async function loadPatients() {
      const tbody = document.getElementById('patientsTableBody');
      tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-gray-400">Chargement…</td></tr>`;
      try {
        patientsCache = await listPatients();
        renderTable();
      } catch (err) {
        console.error(err);
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-red-500">Erreur : ${escapeHtml(err.message)}</td></tr>`;
      }
    }

    function renderTable() {
      const tbody = document.getElementById('patientsTableBody');
      if (!patientsCache.length) {
        tbody.innerHTML = `<tr><td colspan="7" class="text-center py-12 text-gray-400">
          <i class="fas fa-users text-4xl mb-3 block"></i>Aucun patient enregistré</td></tr>`;
        return;
      }
      tbody.innerHTML = patientsCache.map(p => {
        const age = calcAge(p.date_of_birth);
        const genderText = p.gender === 'M' ? 'Masculin' : p.gender === 'F' ? 'Féminin' : '-';
        const diag = (p.diagnosis || '').trim();
        const diagShort = diag.length > 40 ? diag.slice(0, 40) + '…' : diag;
        return `<tr>
          <td class="font-medium text-gray-800">${escapeHtml(fullName(p))}</td>
          <td>${p.date_of_birth ? formatDateFR(p.date_of_birth) : '—'}</td>
          <td>${age !== '' ? age + ' ans' : '—'}</td>
          <td>${genderText}</td>
          <td class="max-w-xs">
            ${diag
              ? `<span class="inline-block px-2 py-1 bg-purple-50 text-purple-700 rounded-md text-xs" title="${escapeHtml(diag)}">${escapeHtml(diagShort)}</span>`
              : '<span class="text-gray-300">—</span>'}
          </td>
          <td><i class="fas fa-phone-alt text-gray-400 w-4"></i> ${escapeHtml(p.phone || '')}</td>
          <td>
            <div class="flex space-x-2">
              <button onclick="editPatient('${p.id}')" class="text-blue-600 hover:text-blue-800 p-2 rounded-lg hover:bg-blue-50" title="Modifier"><i class="fas fa-edit"></i></button>
              <button onclick="removePatient('${p.id}')" class="text-red-600 hover:text-red-800 p-2 rounded-lg hover:bg-red-50" title="Supprimer"><i class="fas fa-trash-alt"></i></button>
              <a href="appointments.html?patient_id=${p.id}" class="text-purple-600 hover:text-purple-800 p-2 rounded-lg hover:bg-purple-50" title="Rendez-vous"><i class="fas fa-calendar-alt"></i></a>
            </div>
          </td>
        </tr>`;
      }).join('');
    }

    window.openPatientModal = function () {
      document.getElementById('patientForm').reset();
      document.getElementById('patientId').value = '';
      document.getElementById('modalTitle').textContent = 'Nouveau patient';
      document.getElementById('patientModal').style.display = 'flex';
    };

    window.closePatientModal = function () {
      document.getElementById('patientModal').style.display = 'none';
    };

    window.editPatient = function (id) {
      const p = patientsCache.find(x => x.id === id);
      if (!p) return;
      document.getElementById('patientId').value = p.id;
      document.getElementById('firstName').value = p.first_name || '';
      document.getElementById('lastName').value = p.last_name || '';
      document.getElementById('dob').value = p.date_of_birth || '';
      document.getElementById('gender').value = p.gender || '';
      document.getElementById('phone').value = p.phone || '';
      document.getElementById('address').value = p.address || '';
      document.getElementById('emergencyName').value = p.emergency_contact_name || '';
      document.getElementById('emergencyPhone').value = p.emergency_contact_phone || '';
      document.getElementById('diagnosis').value = p.diagnosis || '';
      document.getElementById('medicalHistory').value = p.medical_history || '';
      document.getElementById('psychiatricHistory').value = p.psychiatric_history || '';
      document.getElementById('modalTitle').textContent = 'Modifier le patient';
      document.getElementById('patientModal').style.display = 'flex';
    };

    window.removePatient = async function (id) {
      if (!confirm('Supprimer ce patient ?')) return;
      try {
        await deletePatient(id);
        showMessage('messages', 'Patient supprimé avec succès.', 'success');
        loadPatients();
      } catch (err) {
        showMessage('messages', 'Erreur : ' + err.message, 'error');
      }
    };

    document.getElementById('patientForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('patientId').value;
      const data = {
        first_name: document.getElementById('firstName').value.trim(),
        last_name:  document.getElementById('lastName').value.trim(),
        date_of_birth: document.getElementById('dob').value,
        gender:     document.getElementById('gender').value || null,
        phone:      document.getElementById('phone').value.trim(),
        address:    document.getElementById('address').value.trim() || null,
        emergency_contact_name:  document.getElementById('emergencyName').value.trim() || null,
        emergency_contact_phone: document.getElementById('emergencyPhone').value.trim() || null,
        diagnosis:  document.getElementById('diagnosis').value.trim() || null,
        medical_history: document.getElementById('medicalHistory').value.trim() || null,
        psychiatric_history: document.getElementById('psychiatricHistory').value.trim() || null
      };
      try {
        if (id) {
          await updatePatient(id, data);
          showMessage('messages', 'Patient mis à jour avec succès.', 'success');
        } else {
          await addPatient(data);
          showMessage('messages', 'Patient ajouté avec succès.', 'success');
        }
        closePatientModal();
        loadPatients();
      } catch (err) {
        console.error(err);
        showMessage('messages', 'Erreur : ' + err.message, 'error');
      }
    });
  </script>
</body>
</html>
