<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord — Cabinet Psychiatrique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="font-inter bg-gradient-to-br from-slate-50 via-white to-purple-50/30">
  <div id="layout"></div>
  <main class="ml-72 min-h-screen">
    <div id="topbar"></div>
    <div class="p-8">

      <!-- ============ BIRTHDAY BANNER (JS injects here) ============ -->
      <div id="birthdayBanner"></div>

      <!-- ============ STATS GRID (JS injects here) ============ -->
      <div id="statsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
        <div class="stat-card"><p class="text-gray-400 text-sm">Chargement…</p></div>
      </div>

      <!-- ============ UPCOMING APPOINTMENTS & RECENT PATIENTS ============ -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

        <!-- Upcoming appointments -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="px-6 py-4 bg-gradient-to-r from-purple-50 to-pink-50 border-b border-gray-100">
            <h3 class="font-bold text-gray-800 flex items-center">
              <i class="fas fa-calendar-week text-purple-600 mr-2"></i>
              Rendez-vous à venir
            </h3>
          </div>
          <div id="upcomingList" class="divide-y divide-gray-100">
            <div class="p-8 text-center text-gray-400"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
          </div>
        </div>

        <!-- Recent patients -->
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
          <div class="px-6 py-4 bg-gradient-to-r from-blue-50 to-indigo-50 border-b border-gray-100">
            <h3 class="font-bold text-gray-800 flex items-center">
              <i class="fas fa-user-plus text-blue-600 mr-2"></i>
              Derniers patients
            </h3>
          </div>
          <div id="recentPatientsList" class="divide-y divide-gray-100">
            <div class="p-8 text-center text-gray-400"><i class="fas fa-spinner fa-spin text-2xl"></i></div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <script type="module">
    /* ============================================================
       1. IMPORTS
       ============================================================ */
    import { requireAuth } from './assets/js/auth.js';
    import { renderLayout } from './assets/js/layout.js';
    import {
      getStats,
      getUpcomingAppointments,
      getRecentPatients,
      getUpcomingBirthdays
    } from './assets/js/db.js';
    import { escapeHtml, fullName } from './assets/js/helpers.js';

    /* ============================================================
       2. BOOTSTRAP — auth guard + layout + load data
       ============================================================ */
    (async () => {
      await requireAuth();           // redirects to login.html if not signed in
      renderLayout('dashboard.html');    // renders sidebar + topbar
      await loadAll();               // loads dashboard content
    })();

    async function loadAll() {
      await Promise.all([
        loadStats(),
        loadBirthdays(),
        loadUpcoming(),
        loadRecent()
      ]);
    }

    /* ============================================================
       3. STATS GRID
          Mirrors the four stat cards from the PHP version:
          - Total Patients
          - Rendez-vous aujourd'hui
          - Consultations terminées (this month)
          - Prescriptions
       ============================================================ */
    async function loadStats() {
      const s = await getStats();
      document.getElementById('statsGrid').innerHTML = `
        ${statCard('Total Patients', s.total_patients, 'users', 'blue', 'Depuis la création')}
        ${statCard("Rendez-vous aujourd'hui", s.today_appointments, 'calendar-day', 'purple', 'Consultations programmées')}
        ${statCard('Consultations terminées', s.completed_this_month, 'check-circle', 'green', 'Ce mois-ci')}
        ${statCard('Prescriptions', s.total_prescriptions, 'prescription-bottle', 'pink', 'Ordonnances émises')}
      `;
    }

    function statCard(label, value, icon, color, sub) {
      return `
        <div class="stat-card">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500 text-sm font-medium">${escapeHtml(label)}</p>
              <p class="text-3xl font-bold text-gray-800 mt-1">${escapeHtml(value)}</p>
            </div>
            <div class="w-12 h-12 bg-gradient-to-br from-${color}-500 to-${color}-600 rounded-xl flex items-center justify-center shadow-lg">
              <i class="fas fa-${icon} text-white text-xl"></i>
            </div>
          </div>
          <div class="mt-3 text-xs text-gray-400">${escapeHtml(sub)}</div>
        </div>`;
    }

    /* ============================================================
       4. BIRTHDAY BANNER
          Same design as the PHP version's birthday card
       ============================================================ */
    async function loadBirthdays() {
      const list = await getUpcomingBirthdays(7);
      const box = document.getElementById('birthdayBanner');
      if (!list.length) { box.innerHTML = ''; return; }

      const todayStr = new Date().toISOString().slice(5, 10);
      const todayBirthdays = list.filter(p => {
        const d = p.date_of_birth?.toDate ? p.date_of_birth.toDate() : new Date(p.date_of_birth);
        return d.toISOString().slice(5, 10) === todayStr;
      });

      const summary = todayBirthdays.length
        ? `Aujourd'hui : ${todayBirthdays.map(p => fullName(p)).join(', ')}`
        : `${list.length} patient(s) fêtent leur anniversaire cette semaine`;

      box.innerHTML = `
        <div class="mb-8 birthday-card rounded-2xl p-5 shadow-lg animate-fadeInUp">
          <div class="flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center space-x-4">
              <div class="w-12 h-12 bg-amber-500 rounded-xl flex items-center justify-center">
                <i class="fas fa-birthday-cake text-white text-xl"></i>
              </div>
              <div>
                <h3 class="font-bold text-amber-800 text-lg">🎂 Anniversaires à venir</h3>
                <p class="text-amber-700 text-sm">${escapeHtml(summary)}</p>
              </div>
            </div>
            <div class="flex flex-wrap gap-2">
              ${list.slice(0, 3).map(b => {
                const d = b.date_of_birth?.toDate ? b.date_of_birth.toDate() : new Date(b.date_of_birth);
                const day = String(d.getDate()).padStart(2, '0');
                const month = String(d.getMonth() + 1).padStart(2, '0');
                return `<span class="px-3 py-1 bg-amber-200 text-amber-800 rounded-full text-sm font-medium">
                  ${escapeHtml(b.first_name)} : ${day}/${month}
                </span>`;
              }).join('')}
            </div>
          </div>
        </div>`;
    }

    /* ============================================================
       5. UPCOMING APPOINTMENTS (next 7 days)
          Same design as the PHP version's "Rendez-vous à venir" list
       ============================================================ */
    async function loadUpcoming() {
      const list = await getUpcomingAppointments(7);
      const box = document.getElementById('upcomingList');
      if (!list.length) {
        box.innerHTML = `<div class="p-8 text-center text-gray-400">
          <i class="fas fa-calendar-check text-4xl mb-3 block"></i>
          <p>Aucun rendez-vous programmé</p></div>`;
        return;
      }
      box.innerHTML = list.map(a => {
        const d = a.appointment_date?.toDate ? a.appointment_date.toDate() : new Date(a.appointment_date);
        const dt = d.toLocaleString('fr-FR', {
          day: '2-digit', month: '2-digit', year: 'numeric',
          hour: '2-digit', minute: '2-digit'
        });
        return `
          <div class="p-4 hover:bg-gray-50 transition-colors">
            <div class="flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center">
                  <i class="fas fa-user text-purple-600"></i>
                </div>
                <div>
                  <p class="font-medium text-gray-800">${escapeHtml(fullName(a.patient || {}))}</p>
                  <p class="text-sm text-gray-500">
                    <i class="far fa-clock mr-1"></i>${escapeHtml(dt)}
                  </p>
                </div>
              </div>
              <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium">Programmé</span>
            </div>
          </div>`;
      }).join('');
    }

    /* ============================================================
       6. RECENT PATIENTS (last 5 added)
          Same design as the PHP version's "Derniers patients" list
       ============================================================ */
    async function loadRecent() {
      const list = await getRecentPatients(5);
      const box = document.getElementById('recentPatientsList');
      if (!list.length) {
        box.innerHTML = `<div class="p-8 text-center text-gray-400">
          <i class="fas fa-users text-4xl mb-3 block"></i>
          <p>Aucun patient enregistré</p></div>`;
        return;
      }
      box.innerHTML = list.map(p => `
        <div class="p-4 hover:bg-gray-50 transition-colors">
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
              <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center">
                <i class="fas fa-user text-blue-600"></i>
              </div>
              <div>
                <p class="font-medium text-gray-800">${escapeHtml(fullName(p))}</p>
                <p class="text-sm text-gray-500">📞 ${escapeHtml(p.phone || '')}</p>
              </div>
            </div>
            <a href="patients.html" class="text-purple-600 hover:text-purple-700">
              <i class="fas fa-chevron-right"></i>
            </a>
          </div>
        </div>`).join('');
    }
  </script>
</body>
</html>
